name: חיפוש תמונות מוצרים

# Once a night: build the product list, then look up photos for products that have none yet
# on the free Open Food Facts family of databases. Runs apart from the hourly price update so
# it never slows it down; the next hourly update publishes the new photos.
on:
  schedule:
    - cron: "20 0 * * *"   # about 02:20 / 03:20 Israel time
  workflow_dispatch:
  pull_request:            # a change to the photo search is tried out (short run, nothing saved)
    paths: [scripts/fetch_images.py, .github/workflows/images.yml]

permissions:
  contents: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: רשימת המוצרים מכל הרשתות
        run: python3 scripts/fetch_prices.py
      - name: חיפוש תמונות
        env:
          IMAGE_MINUTES: ${{ github.event_name == 'pull_request' && '5' || '80' }}
        run: python3 scripts/fetch_images.py
      - name: שמירת התמונות
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "sal-zo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/images.json
          git diff --cached --quiet && exit 0
          git commit -m "עדכון תמונות מוצרים [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 10; done
          echo "לא הצלחתי לשמור תמונות, ננסה מחר"
