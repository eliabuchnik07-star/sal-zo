name: בדיקת רשתות חדשות (פעם בשבועיים)

on:
  schedule:
    - cron: "0 6 1,15 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: בדיקה
        env:
          ALERT_FILE: alert.txt
        run: python3 scripts/check_chains.py | tee report.md >> "$GITHUB_STEP_SUMMARY"
      - name: פתיחת התראה אם צריך
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s alert.txt ]; then
            gh issue create --title "בדיקת רשתות: יש משהו לטפל בו ($(date +%d/%m/%Y))" --body-file report.md
          fi
