name: בדיקת רשתות חדשות (כל יום)

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: בדיקה
        env:
          ALERT_FILE: alert.txt
        run: python3 scripts/check_chains.py | tee report.md >> "$GITHUB_STEP_SUMMARY"
      - name: פתיחת התראה אם צריך
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # one open issue at a time, so a daily check doesn't flood the list
          if [ -s alert.txt ] && [ -z "$(gh issue list --state open --search 'בדיקת רשתות in:title' --json number -q '.[].number')" ]; then
            gh issue create --title "בדיקת רשתות: יש משהו לטפל בו ($(date +%d/%m/%Y))" --body-file report.md
          fi
