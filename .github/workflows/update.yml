name: עדכון מחירים ופרסום האתר

on:
  schedule:
    - cron: "10 * * * *"   # every hour; also picks up new branches from the chains' store files
  workflow_dispatch:
  repository_dispatch:     # sent by the price script on the computer in Israel after each upload
    types: [local-prices]
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: הורדת מחירים מכל הרשתות
        run: python3 scripts/fetch_prices.py
      - name: חיפוש תמונות מוצרים (פעם ביום בלילה, או בהרצה ידנית)
        run: |
          if [ "$(date -u +%H)" = "03" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/fetch_images.py
            git config user.name "sal-zo-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data/images.json
            git diff --cached --quiet || (git commit -m "עדכון תמונות מוצרים [skip ci]" && (git pull --rebase -q origin main && git push || echo "לא הצלחתי לשמור תמונות, ננסה בפעם הבאה"))
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
