name: עדכון מחירים ופרסום האתר

on:
  schedule:
    - cron: "10 * * * *"   # backup only; the real hourly clock is hourly-timer.yml (GitHub often skips this cron)
  workflow_dispatch:
  repository_dispatch:     # sent by the price script on the computer in Israel after each upload
    types: [local-prices]
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: הורדת מחירים מכל הרשתות
        run: python3 scripts/fetch_prices.py
      # Product photo search is off: the site waits for an official licensed catalog (GS1 / manufacturers).
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
